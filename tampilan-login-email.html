<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fdf2f2;
      font-family: 'DM Sans', sans-serif;
    }

    .em-card {
      width: 380px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(234,67,53,0.10);
      border: 0.5px solid #f0c0c0;
    }

    /* TOP HEADER */
    .em-top {
      background: #ea4335;
      padding: 2.5rem 2rem 4rem;
      position: relative;
      overflow: hidden;
    }
    .em-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .em-icon-wrap {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.18);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
      position: relative; z-index: 2;
    }
    .em-icon-wrap svg { width: 28px; height: 28px; fill: white; }
    .em-title {
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
      position: relative; z-index: 2;
    }
    .em-sub {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      position: relative; z-index: 2;
    }

    /* BODY */
    .em-body {
      padding: 2rem 2rem 2.5rem;
      margin-top: -20px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      position: relative;
    }

    .em-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }
    .em-field { margin-bottom: 1.1rem; }

    .em-input-wrap { position: relative; }
    .em-input-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      display: flex; align-items: center;
    }
    .em-input-icon svg {
      width: 17px; height: 17px;
      stroke: currentColor; fill: none; stroke-width: 2;
    }
    .em-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 0.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: #111827;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .em-input:focus {
      border-color: #ea4335;
      box-shadow: 0 0 0 3px rgba(234,67,53,0.1);
      background: #fff;
    }
    .em-eye {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      cursor: pointer;
      display: flex; align-items: center;
    }
    .em-eye svg {
      width: 17px; height: 17px;
      stroke: currentColor; fill: none; stroke-width: 2;
    }

    .em-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.5rem 0 1.4rem;
    }
    .em-check-row { display: flex; align-items: center; gap: 7px; }
    .em-check { accent-color: #ea4335; width: 15px; height: 15px; cursor: pointer; }
    .em-check-label { font-size: 13px; color: #6b7280; }
    .em-forgot { font-size: 13px; color: #ea4335; font-weight: 600; cursor: pointer; text-decoration: none; }

    .em-btn {
      width: 100%;
      padding: 13px;
      background: #ea4335;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.2px;
    }
    .em-btn:hover { background: #d03828; }
    .em-btn:active { transform: scale(0.98); }

    .em-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 1.25rem 0;
    }
    .em-div-line { flex: 1; height: 0.5px; background: #e5e7eb; }
    .em-div-text { font-size: 12px; color: #9ca3af; }

    .em-google-btn {
      width: 100%;
      padding: 11px;
      background: #fff;
      border: 0.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      color: #374151;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s;
    }
    .em-google-btn:hover { background: #f9fafb; }

    .em-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 13px;
      color: #6b7280;
    }
    .em-footer a { color: #ea4335; font-weight: 600; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>

<div class="em-card">
  <!-- HEADER -->
  <div class="em-top">
    <div class="em-circle" style="width:130px;height:130px;top:-50px;right:-40px;"></div>
    <div class="em-circle" style="width:80px;height:80px;bottom:-20px;left:-20px;"></div>
    <div class="em-icon-wrap">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    </div>
    <div class="em-title">Masuk ke akun</div>
    <div class="em-sub">Selamat datang kembali!</div>
  </div>

  <!-- BODY -->
  <div class="em-body">
    <div class="em-field">
      <label class="em-label" for="em-email">Alamat email</label>
      <div class="em-input-wrap">
        <span class="em-input-icon">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
        </span>
        <input type="email" id="em-email" class="em-input" placeholder="contoh@email.com"/>
      </div>
    </div>

    <div class="em-field">
      <label class="em-label" for="em-pw">Kata sandi</label>
      <div class="em-input-wrap">
        <span class="em-input-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="em-pw" class="em-input" placeholder="Masukkan kata sandi"/>
        <span class="em-eye" onclick="togglePw()" id="em-eye">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
    </div>

    <div class="em-row">
      <div class="em-check-row">
        <input type="checkbox" class="em-check" id="em-remember"/>
        <label class="em-check-label" for="em-remember">Ingat saya</label>
      </div>
      <a class="em-forgot" href="#">Lupa kata sandi?</a>
    </div>

    <button class="em-btn">Masuk</button>

    <div class="em-divider">
      <div class="em-div-line"></div>
      <span class="em-div-text">atau lanjutkan dengan</span>
      <div class="em-div-line"></div>
    </div>

    <button class="em-google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3C17.782 1.145 15.055 0 12 0 7.27 0 3.198 2.698 1.24 6.65l4.026 3.115z"/>
        <path fill="#34A853" d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 0 1-6.723-4.823l-4.04 3.067A11.965 11.965 0 0 0 12 24c2.933 0 5.735-1.043 7.834-3l-3.793-2.987z"/>
        <path fill="#4A90E2" d="M19.834 21c2.195-2.048 3.62-5.096 3.62-9 0-.71-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 21z"/>
        <path fill="#FBBC05" d="M5.277 14.268A7.12 7.12 0 0 1 4.909 12c0-.782.125-1.533.357-2.235L1.24 6.65A11.934 11.934 0 0 0 0 12c0 1.92.445 3.73 1.237 5.335l4.04-3.067z"/>
      </svg>
      Masuk dengan Google
    </button>

    <div class="em-footer">
      Belum punya akun? <a href="#">Daftar sekarang</a>
    </div>
  </div>
</div>

<script>
  function togglePw() {
    const inp = document.getElementById('em-pw');
    const eye = document.getElementById('em-eye');
    if (inp.type === 'password') {
      inp.type = 'text';
      eye.innerHTML = '<svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    } else {
      inp.type = 'password';
      eye.innerHTML = '<svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }
  }
</script>

</body>
</html>
