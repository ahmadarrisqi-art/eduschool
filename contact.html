<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
      padding:20px;
    }

   .contact-container{
  width:100%;
  max-width:1100px;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:rgba(255,255,255,0.1);

  -webkit-backdrop-filter: blur(15px);
  backdrop-filter: blur(15px);

  border:1px solid rgba(255,255,255,0.2);
  border-radius:30px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

    .contact-left{
      padding:60px;
      color:white;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .contact-left h1{
      font-size:50px;
      margin-bottom:20px;
      line-height:1.1;
    }

    .contact-left p{
      color:#dbeafe;
      line-height:1.8;
      margin-bottom:35px;
    }
    .send-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:15px;

  background:#2563eb;
  color:white;

  font-size:17px;
  font-weight:600;

  cursor:pointer;

  outline:none;
  -webkit-appearance:none;
  appearance:none;
  

  transition:0.3s;
}

.send-btn:hover{
  background:#1d4ed8;
}

    .info-box{
      display:flex;
      align-items:center;
      gap:15px;
      margin-bottom:20px;
      background:rgba(255,255,255,0.08);
      padding:18px;
      border-radius:18px;
      transition:0.3s ease;
    }

    .info-box:hover{
      transform:translateX(8px);
      background:rgba(255,255,255,0.15);
    }

    .icon{
      width:50px;
      height:50px;
      border-radius:50%;
      background:white;
      color:#2563eb;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:20px;
      font-weight:bold;
    }

    .contact-right{
      background:white;
      padding:60px;
    }

    .contact-right h2{
      color:#1e3a8a;
      margin-bottom:25px;
      font-size:35px;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box input,
    .input-box textarea{
      width:100%;
      padding:16px;
      border:none;
      outline:none;
      background:#f1f5f9;
      border-radius:15px;
      font-size:15px;
      transition:0.3s;
    }

    .input-box input:focus,
    .input-box textarea:focus{
      background:#e0ecff;
      box-shadow:0 0 0 3px rgba(37,99,235,0.2);
    }

    .input-box textarea{
      resize:none;
      height:140px;
    }

    .send-btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:15px;
      background:linear-gradient(135deg,#2563eb,#1e40af);
      color:white;
      font-size:17px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s ease;
    }

    .send-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 25px rgba(37,99,235,0.4);
    }

    @media(max-width:900px){

      .contact-container{
        grid-template-columns:1fr;
      }

      .contact-left,
      .contact-right{
        padding:40px 30px;
      }

      .contact-left h1{
        font-size:40px;
      }

    }

  </style>
</head>
<body>

  <div class="contact-container">

    <div class="contact-left">

      <h1>Contact Us</h1>

      <p>
        Have questions or want to join our Japanese learning program?
        Feel free to contact us anytime.
      </p>

      <div class="info-box">
        <div class="icon">📍</div>
        <div>
          <h3>Address</h3>
          <p>Tokyo Street, Japan</p>
        </div>
      </div>

      <div class="info-box">
        <div class="icon">📧</div>
        <div>
          <h3>Email</h3>
          <p>edujapan@gmail.com</p>
        </div>
      </div>

      <div class="info-box">
        <div class="icon">📞</div>
        <div>
          <h3>Phone</h3>
          <p>+81 123 456 789</p>
        </div>
      </div>

    </div>

    <div class="contact-right">

      <h2>Send Message</h2>

      <form>

        <div class="input-box">
          <input type="text" placeholder="Your Name" required>
        </div>

        <div class="input-box">
          <input type="email" placeholder="Your Email" required>
        </div>

        <div class="input-box">
          <textarea placeholder="Your Message"></textarea>
        </div>

       <button type="submit" class="send-btn">
  Send Message
</button>

      </form>

    </div>

  </div>

</body>
</html>
